{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sunday League{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'league/app.css' %}">
</head>
<body>
  <div class="frame">
    <header class="top">
      <a class="mark" href="{% url 'home' %}">Sunday League</a>
      <nav>
        <a href="{% url 'standings' %}">Таблица</a>
        <a href="{% url 'match-list' %}">Игры</a>
        <a href="{% url 'rules' %}">Правила</a>
        {% if user.is_staff %}
          <a href="{% url 'match-create' %}">Добавить матч</a>
        {% endif %}
        <a href="/admin/">{% if user.is_staff %}Админка{% else %}Войти{% endif %}</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      Воскресный футбол · на Щипок 28
    </footer>
  </div>
</body>
</html>
